<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A browser puzzle about Wang tiles, local rules, and emergent patterns."
    />
    <title>Wang Pattern Forge</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section id="menu-screen" class="menu-screen" aria-label="Level select">
        <div class="menu-title">
          <p class="eyebrow">Wang tile puzzle</p>
          <h1>Pattern Forge</h1>
          <p class="tagline">Local rules. Global patterns.</p>
        </div>
        <div id="level-list" class="level-list" aria-label="Choose a pattern"></div>
        <a class="legacy-link" href="legacy/chromaweld-rush/index.html">
          Play archived Chromaweld Rush
        </a>
      </section>

      <section id="game-screen" class="game-screen" hidden>
        <header class="game-header">
          <button class="secondary-button" id="back-button" type="button">
            Levels
          </button>
          <div>
            <p class="eyebrow" id="level-kicker">Pattern</p>
            <h1 id="level-title">Level</h1>
          </div>
          <div class="settings-row">
            <button
              class="secondary-button"
              id="theme-button"
              type="button"
              aria-pressed="true"
            >
              Dark
            </button>
            <button
              class="secondary-button"
              id="sound-button"
              type="button"
              aria-pressed="true"
            >
              Sound On
            </button>
          </div>
        </header>

        <section class="game-layout">
          <aside class="panel objective-panel">
            <h2>Pattern Contract</h2>
            <div class="metric-grid">
              <div>
                <span class="metric-label">Filled</span>
                <strong id="filled-count">0/0</strong>
              </div>
              <div>
                <span class="metric-label">Threads</span>
                <strong id="thread-count">0/0</strong>
              </div>
              <div>
                <span class="metric-label">Motifs</span>
                <strong id="motif-count">0</strong>
              </div>
              <div>
                <span class="metric-label">Repeats</span>
                <strong id="repeat-count">0</strong>
              </div>
            </div>
            <div id="goals" class="goals"></div>
            <p id="message" class="message" role="status" aria-live="polite"></p>
          </aside>

          <section class="board-panel">
            <div id="board" class="board" role="grid" aria-label="Pattern board"></div>
            <div
              id="win-panel"
              class="win-panel"
              role="status"
              aria-live="assertive"
              hidden
            >
              <span class="eyebrow">Pattern accepted</span>
              <strong id="win-title">Beautiful constraint.</strong>
              <p id="win-summary"></p>
              <div class="button-row">
                <button class="primary-button" id="next-button" type="button">
                  Next Pattern
                </button>
                <button class="secondary-button" id="replay-button" type="button">
                  Replay
                </button>
              </div>
            </div>
          </section>

          <aside class="panel palette-panel">
            <div class="palette-header">
              <h2>Tile Alphabet</h2>
              <span id="stock-count" class="stock-pill">0 left</span>
            </div>
            <div id="palette" class="palette"></div>
            <div class="button-row">
              <button class="tool-button" id="undo-button" type="button">
                Undo
              </button>
              <button class="tool-button" id="clear-button" type="button">
                Clear
              </button>
              <button class="tool-button" id="hint-button" type="button">
                Hint
              </button>
            </div>
          </aside>
        </section>
      </section>
    </main>

    <script src="src/main.js" defer></script>
  </body>
</html>
