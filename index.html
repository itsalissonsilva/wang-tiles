<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A fast browser puzzle game inspired by Wang tiles."
    />
    <title>Chromaweld Rush</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand">
          <p class="eyebrow">Wang tile arcade</p>
          <h1>Chromaweld Rush</h1>
        </div>
        <div class="topbar-actions">
          <button
            class="secondary-button"
            id="sound-button"
            type="button"
            aria-pressed="true"
          >
            Sound On
          </button>
          <button
            class="secondary-button"
            id="theme-button"
            type="button"
            aria-pressed="true"
          >
            Dark
          </button>
          <button
            class="secondary-button"
            id="menu-button"
            type="button"
            hidden
          >
            Menu
          </button>
        </div>
      </header>

      <section id="menu-screen" class="menu-screen" aria-label="Level select">
        <div class="menu-stage">
          <p class="eyebrow">Select level</p>
          <div
            class="preview-grid"
            id="preview-grid"
            aria-label="Tutorial preview"
          ></div>
        </div>

        <div class="mode-list" aria-label="Choose a board size">
          <button class="mode-card" type="button" data-mode="tutorial">
            <span>Tutorial</span>
            <strong>Tiny</strong>
            <small>2 cores / 70 sec</small>
            <em data-best-for="tutorial">Best 0</em>
          </button>
          <button class="mode-card" type="button" data-mode="sprint">
            <span>Sprint</span>
            <strong>4 x 4</strong>
            <small>4 cores / 65 sec</small>
            <em data-best-for="sprint">Best 0</em>
          </button>
          <button class="mode-card" type="button" data-mode="rush">
            <span>Rush</span>
            <strong>6 x 6</strong>
            <small>7 cores / 100 sec</small>
            <em data-best-for="rush">Best 0</em>
          </button>
          <button class="mode-card" type="button" data-mode="gauntlet">
            <span>Gauntlet</span>
            <strong>8 x 8</strong>
            <small>10 cores / 130 sec</small>
            <em data-best-for="gauntlet">Best 0</em>
          </button>
        </div>
      </section>

      <section
        id="game-screen"
        class="game-screen"
        aria-label="Chromaweld Rush game"
        hidden
      >
        <section class="command-bar" aria-label="Round controls">
          <div>
            <span class="metric-label">Mode</span>
            <strong id="mode-label">Sprint</strong>
          </div>
          <div class="tool-row">
            <button
              class="tool-button"
              id="rotate-button"
              type="button"
              aria-label="Rotate selected tile"
              title="Rotate selected tile"
            >
              Rot
            </button>
            <button
              class="tool-button"
              id="hint-button"
              type="button"
              aria-label="Show a strong match"
              title="Show a strong match"
            >
              Hint
            </button>
            <button
              class="tool-button"
              id="mix-button"
              type="button"
              aria-label="Remix tile tray"
              title="Remix tile tray"
            >
              Mix
            </button>
            <button
              class="tool-button"
              id="retry-button"
              type="button"
              aria-label="Restart this round"
              title="Restart this round"
            >
              Retry
            </button>
          </div>
        </section>

        <section class="game-layout">
          <aside class="panel status-panel" aria-label="Round status">
            <div class="urgent-metric" id="time-card">
              <span class="metric-label">Time</span>
              <strong id="time-left">0:00</strong>
            </div>
            <div>
              <span class="metric-label">Score</span>
              <strong id="score">0</strong>
            </div>
            <div>
              <span class="metric-label">Cores</span>
              <strong id="cores-lit">0</strong>
            </div>
            <div>
              <span class="metric-label">Flux</span>
              <strong id="flux-count">0</strong>
            </div>
            <div>
              <span class="metric-label">Chain</span>
              <strong id="streak">0</strong>
            </div>
            <div>
              <span class="metric-label">Tiles</span>
              <strong id="tiles-left">0</strong>
            </div>
            <div>
              <span class="metric-label">Best</span>
              <strong id="best-score">0</strong>
            </div>
          </aside>

          <section class="board-panel" aria-label="Tile board">
            <div class="board-frame">
              <div
                id="board"
                class="board"
                role="grid"
                aria-label="Puzzle grid"
              ></div>
              <div class="goal-track" aria-label="Goal progress">
                <span id="goal-meter"></span>
              </div>
              <p
                id="message"
                class="message"
                role="status"
                aria-live="polite"
              ></p>
            </div>
            <div
              class="round-panel"
              id="round-panel"
              role="status"
              aria-live="assertive"
              hidden
            >
              <span id="round-kicker">Round over</span>
              <strong id="round-title">Time</strong>
              <p id="round-summary"></p>
              <div class="round-actions">
                <button class="primary-button" id="next-button" type="button">
                  Next
                </button>
                <button
                  class="secondary-button"
                  id="round-menu-button"
                  type="button"
                >
                  Menu
                </button>
              </div>
            </div>
          </section>

          <aside class="panel tray-panel" aria-label="Available tiles">
            <div class="tray-header">
              <h2>Tile Tray</h2>
              <span id="combo-label" class="combo-label">Chain x0</span>
            </div>
            <div id="tray" class="tray"></div>
          </aside>
        </section>
      </section>

      <div
        class="modal-backdrop"
        id="tutorial-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="tutorial-title"
        hidden
      >
        <section class="tutorial-popup">
          <span class="eyebrow">Tiny tutorial</span>
          <strong id="tutorial-title">Light every core.</strong>
          <p>Match edges. Strong welds charge nearby sockets.</p>
          <button class="primary-button" id="tutorial-start-button" type="button">
            Start
          </button>
        </section>
      </div>
    </main>

    <script src="src/main.js" defer></script>
  </body>
</html>
